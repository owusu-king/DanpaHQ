<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A furnished living room with daylight from a tall window" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="i-wall" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FBF8F4"/>
      <stop offset="100%" stop-color="#EFE8DF"/>
    </linearGradient>
    <linearGradient id="i-light" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFF6E6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF6E6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="i-outside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEAF2"/>
      <stop offset="62%" stop-color="#F2E6DA"/>
      <stop offset="100%" stop-color="#E6D6C2"/>
    </linearGradient>
    <linearGradient id="i-floor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#C9A882"/>
      <stop offset="100%" stop-color="#A9855D"/>
    </linearGradient>
    <linearGradient id="i-sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5F6B6A"/>
      <stop offset="100%" stop-color="#48524F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#i-wall)"/>

  <!-- Tall window, and the wedge of light it throws across the room. -->
  <rect x="726" y="72" width="386" height="558" rx="6" fill="#EDE5DA"/>
  <rect x="740" y="86" width="358" height="530" rx="3" fill="url(#i-outside)"/>
  <g fill="#B9C9BC" opacity="0.72">
    <ellipse cx="812" cy="530" rx="70" ry="96"/>
    <ellipse cx="1022" cy="548" rx="58" ry="78"/>
  </g>
  <rect x="908" y="86" width="10" height="530" fill="#EDE5DA"/>
  <rect x="740" y="342" width="358" height="9" fill="#EDE5DA"/>
  <path d="M726 630 L1112 630 L980 900 L360 900 Z" fill="url(#i-light)"/>

  <!-- Floor. -->
  <rect x="0" y="640" width="1200" height="260" fill="url(#i-floor)"/>
  <g stroke="#8E6C48" stroke-width="2" opacity="0.28">
    <path d="M0 700h1200M0 764h1200M0 828h1200"/>
  </g>

  <!-- Rug, sofa, cushions. -->
  <ellipse cx="470" cy="790" rx="330" ry="86" fill="#E4D3BD" opacity="0.85"/>
  <ellipse cx="470" cy="790" rx="262" ry="64" fill="none" stroke="#C9B295" stroke-width="4" opacity="0.7"/>

  <rect x="188" y="520" width="452" height="150" rx="20" fill="url(#i-sofa)"/>
  <rect x="204" y="500" width="420" height="84" rx="18" fill="#6C7877"/>
  <g fill="#8B9694">
    <rect x="232" y="516" width="112" height="66" rx="14"/>
    <rect x="366" y="516" width="112" height="66" rx="14"/>
    <rect x="500" y="516" width="96" height="66" rx="14"/>
  </g>
  <g fill="#C88F5E">
    <rect x="258" y="528" width="62" height="48" rx="10"/>
    <rect x="520" y="528" width="58" height="48" rx="10"/>
  </g>
  <g fill="#3B4441">
    <rect x="212" y="662" width="18" height="42" rx="6"/>
    <rect x="600" y="662" width="18" height="42" rx="6"/>
  </g>

  <!-- Low table with a couple of things on it, which is what stops a room
       reading as a showroom. -->
  <rect x="330" y="700" width="230" height="14" rx="7" fill="#7C5A3A"/>
  <rect x="352" y="714" width="12" height="46" rx="5" fill="#7C5A3A"/>
  <rect x="526" y="714" width="12" height="46" rx="5" fill="#7C5A3A"/>
  <rect x="382" y="668" width="42" height="34" rx="4" fill="#B7C4BC"/>
  <ellipse cx="474" cy="694" rx="34" ry="9" fill="#D8C4A8"/>
  <path d="M462 694c0-16 6-28 12-28s12 12 12 28" fill="#E5D6BE"/>

  <!-- Plant in the corner, and a floor lamp. -->
  <path d="M1046 900c-8-70-12-118-14-152" stroke="#7C5A3A" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#3F6B4E">
    <ellipse cx="1010" cy="700" rx="52" ry="26" transform="rotate(-22 1010 700)"/>
    <ellipse cx="1078" cy="694" rx="52" ry="26" transform="rotate(20 1078 694)"/>
    <ellipse cx="1032" cy="646" rx="44" ry="24" transform="rotate(-52 1032 646)"/>
    <ellipse cx="1068" cy="640" rx="44" ry="24" transform="rotate(48 1068 640)"/>
  </g>
  <path d="M1002 748h84l-12 76h-60Z" fill="#B98B60"/>

  <rect x="132" y="470" width="8" height="212" rx="4" fill="#3B4441"/>
  <path d="M100 470h72l-14-56h-44Z" fill="#E9DCC6"/>
  <ellipse cx="136" cy="684" rx="32" ry="8" fill="#3B4441"/>

  <!-- Framed prints, hung slightly off-centre. -->
  <rect x="250" y="196" width="128" height="164" rx="5" fill="#FFFFFF" stroke="#DCD2C4" stroke-width="4"/>
  <rect x="274" y="224" width="80" height="108" rx="3" fill="#D7C4A8"/>
  <rect x="410" y="228" width="104" height="132" rx="5" fill="#FFFFFF" stroke="#DCD2C4" stroke-width="4"/>
  <rect x="430" y="252" width="64" height="84" rx="3" fill="#B7C4BC"/>
</svg>
