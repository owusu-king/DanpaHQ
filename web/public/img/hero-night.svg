<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1000 1100" role="img" aria-label="A modern apartment building lit from within at dusk" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="48%" stop-color="#39281E"/>
      <stop offset="100%" stop-color="#6B3A18"/>
    </linearGradient>
    <radialGradient id="h-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF6E8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#E8792A" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#E8792A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-litface" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%" stop-color="#3A322B"/>
      <stop offset="70%" stop-color="#332B25"/>
      <stop offset="100%" stop-color="#241E1A"/>
    </linearGradient>
    <linearGradient id="h-shadeface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241E1A"/>
      <stop offset="100%" stop-color="#191411"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#5E7382"/>
      <stop offset="52%" stop-color="#2E3F4A"/>
      <stop offset="100%" stop-color="#1B262D"/>
    </linearGradient>
    <linearGradient id="h-glasslit" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFE9C4"/>
      <stop offset="100%" stop-color="#E9B978"/>
    </linearGradient>
    <linearGradient id="h-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241C16"/>
      <stop offset="100%" stop-color="#150F0C"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#h-sky)"/>
  <ellipse cx="236" cy="392" rx="330" ry="290" fill="url(#h-sun)"/>

  <!-- A softer block set back, to give the near building somewhere to stand. -->
  <g opacity="0.30">
    <rect x="20" y="430" width="228" height="560" rx="6" fill="#232C36"/>
    <g fill="#5C6E7A" opacity="0.55">
      <rect x="48" y="470" width="52" height="66" rx="4"/><rect x="120" y="470" width="52" height="66" rx="4"/><rect x="192" y="470" width="34" height="66" rx="4"/>
      <rect x="48" y="566" width="52" height="66" rx="4"/><rect x="120" y="566" width="52" height="66" rx="4"/><rect x="192" y="566" width="34" height="66" rx="4"/>
      <rect x="48" y="662" width="52" height="66" rx="4"/><rect x="120" y="662" width="52" height="66" rx="4"/><rect x="192" y="662" width="34" height="66" rx="4"/>
      <rect x="48" y="758" width="52" height="66" rx="4"/><rect x="120" y="758" width="52" height="66" rx="4"/><rect x="192" y="758" width="34" height="66" rx="4"/>
    </g>
  </g>

  <!-- The subject. Two planes and a set-back top floor, so it reads as a
       building somebody designed rather than an extruded rectangle. -->
  <rect x="286" y="356" width="452" height="634" rx="4" fill="url(#h-litface)"/>
  <rect x="738" y="410" width="196" height="580" rx="4" fill="url(#h-shadeface)"/>
  <rect x="330" y="272" width="360" height="88" rx="4" fill="#2E2721"/>
  <rect x="330" y="272" width="360" height="10" rx="4" fill="#3B322B"/>

  <!-- Slab edges: the strong horizontals that give a facade its rhythm. -->
  <g fill="#3B322B">
    <rect x="278" y="446" width="468" height="13" rx="2"/>
    <rect x="278" y="580" width="468" height="13" rx="2"/>
    <rect x="278" y="714" width="468" height="13" rx="2"/>
    <rect x="278" y="848" width="468" height="13" rx="2"/>
  </g>
  <g fill="#221B17">
    <rect x="738" y="492" width="200" height="11" rx="2"/>
    <rect x="738" y="626" width="200" height="11" rx="2"/>
    <rect x="738" y="760" width="200" height="11" rx="2"/>
    <rect x="738" y="894" width="200" height="11" rx="2"/>
  </g>

  <!-- Glazing. Tall openings, a few lit, most not. -->
  <g fill="url(#h-glass)">
    <rect x="316" y="300" width="104" height="52" rx="3"/><rect x="440" y="300" width="104" height="52" rx="3"/><rect x="564" y="300" width="104" height="52" rx="3"/>
    <rect x="316" y="372" width="104" height="70" rx="3"/><rect x="564" y="372" width="104" height="70" rx="3"/><rect x="688" y="372" width="46" height="70" rx="3"/>
    <rect x="440" y="506" width="104" height="70" rx="3"/><rect x="564" y="506" width="104" height="70" rx="3"/>
    <rect x="316" y="640" width="104" height="70" rx="3"/><rect x="688" y="640" width="46" height="70" rx="3"/>
    <rect x="440" y="774" width="104" height="70" rx="3"/><rect x="564" y="774" width="104" height="70" rx="3"/><rect x="688" y="774" width="46" height="70" rx="3"/>
    <rect x="316" y="908" width="104" height="70" rx="3"/><rect x="564" y="908" width="104" height="70" rx="3"/>
  </g>
  <g fill="url(#h-glasslit)">
    <rect x="440" y="372" width="104" height="70" rx="3"/>
    <rect x="316" y="506" width="104" height="70" rx="3"/><rect x="688" y="506" width="46" height="70" rx="3"/>
    <rect x="440" y="640" width="104" height="70" rx="3"/><rect x="564" y="640" width="104" height="70" rx="3"/>
    <rect x="316" y="774" width="104" height="70" rx="3"/>
    <rect x="440" y="908" width="104" height="70" rx="3"/><rect x="688" y="908" width="46" height="70" rx="3"/>
  </g>
  <g fill="#3A4A55" opacity="0.42">
    <rect x="766" y="430" width="66" height="58" rx="3"/><rect x="856" y="430" width="56" height="58" rx="3"/>
    <rect x="766" y="530" width="66" height="92" rx="3"/><rect x="856" y="530" width="56" height="92" rx="3"/>
    <rect x="766" y="664" width="66" height="92" rx="3"/><rect x="856" y="664" width="56" height="92" rx="3"/>
    <rect x="766" y="798" width="66" height="92" rx="3"/><rect x="856" y="798" width="56" height="92" rx="3"/>
  </g>

  <!-- Balcony glass: a thin translucent plane, which is what dates a building
       as contemporary more than any other single detail. -->
  <g fill="#FFFFFF" opacity="0.07">
    <rect x="278" y="459" width="468" height="34" rx="2"/>
    <rect x="278" y="593" width="468" height="34" rx="2"/>
    <rect x="278" y="727" width="468" height="34" rx="2"/>
    <rect x="278" y="861" width="468" height="34" rx="2"/>
  </g>
  <g stroke="#4A3F36" stroke-width="2" opacity="0.8">
    <path d="M278 459h468M278 593h468M278 727h468M278 861h468"/>
  </g>

  <!-- Ground plane, entrance, and the long shadow of a low sun. -->
  <rect x="0" y="990" width="1000" height="260" fill="url(#h-ground)"/>
  <path d="M286 990h452l236 260H50Z" fill="#0E0A08" opacity="0.55"/>
  <rect x="452" y="878" width="120" height="112" rx="3" fill="#2E3F4A"/>
  <rect x="452" y="878" width="120" height="8" rx="3" fill="#3B322B"/>
  <rect x="508" y="878" width="4" height="112" fill="#6E8494" opacity="0.6"/>

  <!-- Planting at the base, and a palm to break the skyline. -->
  <g>
    <ellipse cx="300" cy="1002" rx="86" ry="20" fill="#1E2A1C" opacity="0.75"/>
    <ellipse cx="726" cy="1004" rx="74" ry="18" fill="#1E2A1C" opacity="0.7"/>
    <path d="M188 992c6-72 10-124 14-166" stroke="#2A211A" stroke-width="15" fill="none" stroke-linecap="round"/>
    <g stroke="#2C4634" stroke-width="12" fill="none" stroke-linecap="round">
      <path d="M204 820c-40-30-80-38-112-26"/>
      <path d="M204 820c42-30 82-36 112-22"/>
      <path d="M204 820c-26-46-56-72-90-84"/>
      <path d="M204 820c30-46 62-70 96-80"/>
      <path d="M204 820c-2-48 2-80 10-110"/>
    </g>
    <g stroke="#223628" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M204 820c-32-14-62-8-86 8"/>
      <path d="M204 820c34-12 64-6 86 10"/>
    </g>
  </g>
</svg>
